name: Build APK
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build direct Tik Dos APK
        run: gradle assembleDebug --stacktrace
      - name: Upload direct APK
        uses: actions/upload-artifact@v4
        with:
          name: tik-dos-direct-apk
          path: app/build/outputs/apk/tikdosTemplate/debug/app-tikdosTemplate-debug.apk
          if-no-files-found: error
