name: Build APK
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare template home image
        run: |
          mkdir -p app/src/tikdosTemplate/assets
          cp app/src/tikdosTemplate/res/drawable/logo_tikdos.png app/src/tikdosTemplate/assets/tikdos_home.jpg

      - name: Build clean Tik Dos template
        run: gradle tikdosTemplateDebug --stacktrace

      - name: Embed template into installer
        run: |
          mkdir -p app/src/installer/assets
          cp app/build/outputs/apk/tikdosTemplate/debug/app-tikdosTemplate-debug.apk app/src/installer/assets/tikdos-template.apk

      - name: Build installer
        run: gradle installerDebug --stacktrace

      - name: Upload installer APK
        uses: actions/upload-artifact@v4
        with:
          name: tik-dos-installer-v1.5
          path: app/build/outputs/apk/installer/debug/app-installer-debug.apk
          if-no-files-found: error

      - name: Upload clean template APK
        uses: actions/upload-artifact@v4
        with:
          name: tik-dos-template-v1.5
          path: app/build/outputs/apk/tikdosTemplate/debug/app-tikdosTemplate-debug.apk
          if-no-files-found: error
