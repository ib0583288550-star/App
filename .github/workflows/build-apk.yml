name: Build APK
on:
  push:
    branches: ["main", "v1.6-responsive-auto", "v1.7-responsive-selectable"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Fetch stable Android debug keystore
        run: |
          mkdir -p signing
          curl -L --fail --silent --show-error -o signing/debug.keystore https://raw.githubusercontent.com/safe-global/safe-android/master/debug.keystore
          keytool -list -keystore signing/debug.keystore -storepass android -alias androiddebugkey >/dev/null
      - name: Build direct Tik Dos APK
        run: gradle assembleDebug --stacktrace
      - name: Upload direct APK
        uses: actions/upload-artifact@v4
        with:
          name: tik-dos-direct-apk
          path: app/build/outputs/apk/tikdosTemplate/debug/app-tikdosTemplate-debug.apk
          if-no-files-found: error
